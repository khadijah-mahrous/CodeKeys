<!DOCTYPE html>
<html>
<head>
    <title>CodeKeys - Account Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="height:100vh; overflow:hidden; flex-direction:row;">

<div class="sidebar-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-logo" onclick="window.location.href='/'">CodeKeys</div>
        <a href="/" style="text-decoration:none;"><div class="nav-item">🏠 HOME</div></a>
        <a href="/dashboard" style="text-decoration:none;"><div class="nav-item">📊 DASHBOARD</div></a>
        <a href="/courses/python" style="text-decoration:none;"><div class="nav-item">📚 COURSES</div></a>
        <a href="/statistics" style="text-decoration:none;"><div class="nav-item">📈 STATISTICS</div></a>
        <a href="/achievements" style="text-decoration:none;"><div class="nav-item">🏆 ACHIEVEMENTS</div></a>
        <div class="nav-item active">⚙️ SETTINGS</div>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="settings-wrapper">
        <div class="settings-card card">
            <div class="settings-header">
                <span class="icon">⚙️</span>
                <h2>Account Settings</h2>
            </div>

            <form id="settingsForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" value="{{ user.name }}" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" value="{{ user.email }}" disabled>
                    <small>Email cannot be changed directly. Contact support to change email.</small>
                </div>

                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Enter current password">
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>

                <button type="submit" class="btn-main btn-save">💾 Save Changes</button>
            </form>

            <div class="divider"></div>

            <button class="btn-main btn-delete" id="deleteAccountBtn">🗑️ Delete Account</button>
            <div class="info-note warning">⚠️ This action cannot be undone</div>
        </div>
    </div>
</div>

<div id="toast" class="toast-message"></div>

<script>
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast-message' + (isError ? ' error' : '');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    document.getElementById('settingsForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('fullName').value.trim();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!name || name.length < 2) { showToast('Name must be at least 2 characters', true); return; }

        if (newPassword || confirmPassword) {
            if (!currentPassword) { showToast('Current password is required to change password', true); return; }
            if (newPassword !== confirmPassword) { showToast('New passwords do not match', true); return; }
            if (newPassword.length < 4) { showToast('Password must be at least 4 characters', true); return; }
            try {
                const res = await fetch('/change_password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                const data = await res.json();
                if (!data.success) { showToast(data.message, true); return; }
                showToast('Password changed successfully!');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } catch { showToast('An error occurred', true); return; }
        }

        if (name !== '{{ user.name }}') {
            const passwordToUse = currentPassword || await askForPassword();
            if (!passwordToUse) { showToast('Password is required to change name', true); return; }
            try {
                const res = await fetch('/change_name', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_name: name, password: passwordToUse })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Name changed successfully!');
                    setTimeout(() => location.reload(), 1500);
                } else { showToast(data.message, true); }
            } catch { showToast('An error occurred', true); }
        } else if (!newPassword) {
            showToast('No changes were made', true);
        }
    });

    async function askForPassword() {
        return new Promise(resolve => resolve(prompt('Please enter your password to confirm name change:')));
    }

    document.getElementById('deleteAccountBtn').addEventListener('click', function() {
        if (confirm('⚠️ WARNING: This will permanently delete your account and ALL your progress.\n\nAre you sure?')) {
            if (prompt('Type "DELETE" to confirm:') === 'DELETE') {
                fetch('/delete_account', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) window.location.href = '/';
                        else showToast(data.message, true);
                    })
                    .catch(() => showToast('An error occurred', true));
            }
        }
    });

    fetch('/check_auth').then(res => res.json()).then(data => {
        if (!data.logged_in) window.location.href = '/?login_required=settings';
    });
</script>
</body>
</html>
