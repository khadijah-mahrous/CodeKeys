<!DOCTYPE html>
<html>
<head>
    <title>CodeKeys - {{ lang|capitalize }} Lesson</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="min-height:100vh; overflow-y:auto;">

<nav>
    <div class="logo" onclick="window.location.href='/'">CodeKeys</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/courses/python">Courses</a>
        <div id="auth-section"></div>
    </div>
</nav>

<div class="lesson-page">
    <h2>Lesson {{ lesson.id }}: {{ lesson.title }}</h2>
    <div class="teacher-note">
        <span class="note-icon">💡</span>
        <p>{{ lesson.instr }}</p>
    </div>
    <div class="editor-container">
        <div class="editor-header">
            <div style="display:flex; gap:8px; margin-right:20px;">
                <div style="width:12px;height:12px;border-radius:50%;background:#ff5f56;"></div>
                <div style="width:12px;height:12px;border-radius:50%;background:#ffbd2e;"></div>
                <div style="width:12px;height:12px;border-radius:50%;background:#27c93f;"></div>
            </div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:#8b949e;">{{ lang }}_module_{{ lesson.id }}.py</span>
        </div>

        <div class="editor-body" id="editor-body" tabindex="0">
            <div class="target-text" id="display-text">
                {% for char in lesson.target %}
                    <span data-char="{{ char }}">{{ char }}</span>
                {% endfor %}
            </div>
            <textarea id="type-input" autofocus autocomplete="off" spellcheck="false" rows="4"
                style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:default;z-index:2;background:transparent;color:white;font-family:'JetBrains Mono',monospace;font-size:1.5rem;border:none;resize:none;outline:none;padding:0;"></textarea>
        </div>
    </div>

    <div class="progress-indicator">
        <span id="progress-text">0% complete</span>
    </div>
    <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<script>
    const input = document.getElementById('type-input');
    const displaySpans = document.querySelectorAll('#display-text span');
    const editorBody = document.getElementById('editor-body');
    const targetText = {{ lesson.target | tojson }};
    const targetChars = Array.from(targetText);

    let startTime = null, completed = false, redirecting = false;
    let mistakesCount = 0, mistakePositions = new Set();

    function normalizeComparisonChar(char) {
        const map = { '\u2018': "'", '\u2019': "'", '\u201C': '"', '\u201D': '"' };
        return map[char] || char;
    }

    function handleKeyPress(e) {
        const currentIndex = input.value.length;
        if (e.key === 'Enter') {
            e.preventDefault();
            if (currentIndex < targetText.length && targetChars[currentIndex] === '\n') {
                input.value += '\n';
                updateHighlighting();
                input.dispatchEvent(new Event('input'));
            }
            return;
        }
        if (currentIndex < targetText.length) {
            let pressedKey = e.key === 'Enter' ? '\n' : e.key;
            const normalizedExpected = normalizeComparisonChar(targetChars[currentIndex]);
            const normalizedPressed = normalizeComparisonChar(pressedKey);
            if (normalizedPressed !== normalizedExpected && pressedKey.length === 1) {
                if (!mistakePositions.has(currentIndex)) { mistakesCount++; mistakePositions.add(currentIndex); }
            }
        }
    }

    input.addEventListener('keydown', handleKeyPress);

    function updateProgress() {
        const progress = (input.value.length / targetText.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('progress-text').textContent = Math.round(progress) + '% complete';
    }

    function updateHighlighting() {
        const typedValue = input.value;
        for (let i = 0; i < displaySpans.length; i++) {
            const span = displaySpans[i];
            span.classList.remove('current', 'correct', 'wrong');
            if (i < typedValue.length) {
                const n = normalizeComparisonChar;
                span.classList.add(n(typedValue[i]) === n(targetChars[i]) ? 'correct' : 'wrong');
            } else if (i === typedValue.length) {
                span.classList.add('current');
                span.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
            }
        }
        updateProgress();
    }

    async function completeLesson() {
        if (completed || redirecting) return;
        completed = redirecting = true;
        const duration = startTime ? (new Date() - startTime) : 60000;
        const typedText = input.value;
        let correctChars = 0;
        const n = normalizeComparisonChar;
        for (let i = 0; i < Math.min(typedText.length, targetText.length); i++) {
            if (n(typedText[i]) === n(targetChars[i])) correctChars++;
        }
        const accuracy = Math.min(100, Math.max(0, Math.round((correctChars / targetText.length) * 100)));
        const wpm = Math.max(0, Math.round((correctChars / 5) / (duration / 60000)));
        try {
            const response = await fetch('/process_stats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lang: "{{ lang }}", lesson_id: {{ lesson.id }}, accuracy, wpm,
                    mistakes: mistakesCount, total_chars: targetText.length, typed_text: typedText })
            });
            const result = await response.json();
            if (result.status === 'success') window.location.href = "/results/{{ lang }}/" + {{ lesson.id }};
            else window.location.href = "/results/{{ lang }}/" + {{ lesson.id }};
        } catch { window.location.href = "/results/{{ lang }}/" + {{ lesson.id }}; }
    }

    input.addEventListener('input', function() {
        if (completed || redirecting) return;
        if (!startTime && input.value.length > 0) startTime = new Date();
        if (input.value.length > targetText.length) { input.value = input.value.slice(0, targetText.length); return; }
        updateHighlighting();
        if (input.value.length === targetText.length) setTimeout(completeLesson, 150);
    });

    function resetLesson() {
        input.value = ''; mistakesCount = 0; mistakePositions.clear();
        completed = redirecting = false; startTime = null;
        updateHighlighting(); input.focus();
    }

    window.addEventListener('load', resetLesson);
    editorBody.addEventListener('click', () => input.focus());
    document.addEventListener('keydown', e => { if (e.key === 'Tab' && document.activeElement === editorBody) { e.preventDefault(); input.focus(); } });
    input.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); input.focus(); } });
    setTimeout(() => input.focus(), 100);

    fetch('/check_auth').then(r => r.json()).then(data => {
        if (data.logged_in && document.getElementById('auth-section')) {
            document.getElementById('auth-section').innerHTML =
                `<span class="user-info"><span class="welcome-text">👋 ${data.name}</span><a href="/logout" class="logout-btn">Logout</a></span>`;
        }
    });
</script>
</body>
</html>
