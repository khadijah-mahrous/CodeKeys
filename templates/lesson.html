<!DOCTYPE html>
<html>
<head>
    <title>CodeKeys - {{ lang|capitalize }} Lesson</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
           min-height: 100vh;
    overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-deep));
        }

        .lesson-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            overflow: auto;
        }

        .lesson-container h2 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .editor-container {
            width: 90%;
    max-width: 800px;
            background: rgba(10, 10, 12, 0.7) !important;
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    margin: 20px auto; /* Centers the box on the page */
            overflow-x: auto;
            overflow-y: hidden;
        }

/* Update these in lesson.html */
.editor-body {
    padding: 50px 40px !important;
    position: relative;
    text-align: left; /* Keep code starting from the left */
    overflow-x: auto; /* Allow horizontal scrolling for long code */
    overflow-y: hidden;
    min-height: 200px;
    display: flex; /* Use flex to keep things on one line */
    justify-content: flex-start;
    align-items: center;
}

.target-text {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 1.5rem;
    font-weight: 600 !important;
    letter-spacing: 0.5px;
    white-space: pre !important; /* Forces everything to stay on ONE line */
    color: rgba(255, 255, 255, 0.3);
    display: flex;
}

.target-text span {
    display: inline-block;
    min-width: 0.6em; /* This makes spaces visible as gaps you can type! */
    transition: 0.1s;
}

/* Style for the current letter you need to type */
.target-text span.current {
    border-bottom: 3px solid var(--accent-secondary);
    color: var(--text-bright);
    background: rgba(139, 92, 246, 0.2);
}


        .editor-body::-webkit-scrollbar {
            height: 6px;
        }

        .editor-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .editor-body::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        #type-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: default;
            z-index: 2;
        }

      

        .target-text span.correct {
            color: #2ecc71 !important;
        }

        .target-text span.wrong {
            color: #e74c3c !important;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .progress-indicator {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .progress-bar-container {
            width: 90%;
            max-width: 1000px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.1s ease;
        }

        nav {
            flex-shrink: 0;
        }

        body::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="window.location.href='/'">CodeKeys</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/courses/python">Courses</a>
        <div id="auth-section"></div>
    </div>
</nav>

<div class="lesson-container">
    <h2>Lesson {{ lesson.id }}: {{ lesson.title }}</h2>
    <p style="color: var(--text-dim); margin-bottom: 10px;">{{ lesson.instr }}</p>

    <div class="editor-container">
        <div class="editor-header" style="background: #161b22; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center;">
            <div style="display: flex; gap: 8px; margin-right: 20px;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f56;"></div>
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #ffbd2e;"></div>
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #27c93f;"></div>
            </div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #8b949e;">{{ lang }}_module_{{ lesson.id }}.py</span>
        </div>
        
        <div class="editor-body" id="editor-body">
            <div class="target-text" id="display-text">
                {% for char in lesson.target %}
                    <span>{{ char }}</span>
                {% endfor %}
            </div>
            <input type="text" id="type-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
    
    <div class="progress-indicator">
        <span id="progress-text">0% complete</span>
    </div>
    <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<script>
    const input = document.getElementById('type-input');
    const displaySpans = document.querySelectorAll('#display-text span');
    const editorBody = document.getElementById('editor-body');
    
    const target = "{{ lesson.target }}";
    const expectedChars = target.split('');
    let startTime = null;
    let completed = false;
    let redirecting = false;
    
    // Stats tracking for accuracy
    let totalKeystrokes = 0;
    let mistakesCount = 0;
    function handleKeyPress(e) {
    if (completed || redirecting) return;

    const currentIndex = input.value.length;
    if (currentIndex < target.length) {
        const expectedChar = expectedChars[currentIndex];
        const pressedKey = e.key;

        totalKeystrokes++;

        // If the pressed key doesn't match the specific character in the lesson
        if (pressedKey !== expectedChar) {
            mistakesCount++;
        }
    }
}

    function updateProgress() {
        const typed = input.value.length;
        const progress = (typed / target.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('progress-text').textContent = Math.round(progress) + '% complete';
    }

    function scrollToCurrent() {
        const currentSpan = document.querySelector('.target-text span.current');
        if (currentSpan) {
            currentSpan.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        }
    }

    function updateHighlighting() {
        const typedValue = input.value;
        const typedChars = typedValue.split('');
        
        displaySpans.forEach((span, index) => {
            span.classList.remove('current', 'correct', 'wrong');
            if (index < typedChars.length) {
                if (typedChars[index] === expectedChars[index]) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('wrong');
                }
            } else if (index === typedChars.length) {
                span.classList.add('current');
            }
        });
        updateProgress();
        scrollToCurrent();
    }

    async function completeLesson() {
    if (completed || redirecting) return;
    
    completed = true;
    redirecting = true;

    const endTime = new Date();
    const duration = startTime ? (endTime - startTime) : 1000;
    const timeInMinutes = duration / 60000;

    // 1. Calculate Accuracy: Final Correct Result / Target Length
    let correctFinalChars = 0;
    const finalTypedText = input.value;
    
    for (let i = 0; i < target.length; i++) {
        if (finalTypedText[i] === target[i]) {
            correctFinalChars++;
        }
    }
    
    let accuracy = Math.round((correctFinalChars / target.length) * 100);

    // 2. Calculate WPM
    let wpm = Math.round((correctFinalChars / 5) / timeInMinutes) || 0;

    // 3. Send to server (matching your app.py requirements)
    try {
        await fetch('/process_stats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                lang: "{{ lang }}",
                lesson_id: {{ lesson.id }},
                accuracy: accuracy,
                wpm: wpm,
                mistakes: mistakesCount, // Total mistakes made during typing
                total_chars: target.length
            })
        });
        window.location.href = "/results/{{ lang }}/" + {{ lesson.id }};
    } catch (error) {
        window.location.href = "/results/{{ lang }}/" + {{ lesson.id }};
    }
}
    input.addEventListener('keydown', (e) => {
        if (completed) return;
        if (!startTime) startTime = new Date();
        
        const ignored = ['Shift', 'Control', 'Alt', 'CapsLock', 'Tab'];
        if (!ignored.includes(e.key) && e.key !== 'Backspace') {
            totalKeystrokes++;
            if (e.key !== expectedChars[input.value.length]) {
                mistakesCount++;
            }
        }
    });

    input.addEventListener('input', () => {
        if (completed) return;
        updateHighlighting();
        if (input.value.length === target.length) {
            setTimeout(completeLesson, 150);
        }
    });

    // Auto-focus the input so you can start typing immediately
   // Inside the 'load' event listener at the bottom of lesson.html
window.addEventListener('load', function() {
    input.value = '';
    totalKeystrokes = 0; // Tracks every key pressed
    mistakesCount = 0;   // Tracks incorrect keys
    completed = false;
    redirecting = false;
    startTime = null;
    input.focus();
    updateHighlighting();
});
    // Refocus if user clicks anywhere on the editor
    editorBody.addEventListener('click', () => input.focus());
</script>
</body>
</html>
